# Reference this view as my_db_main__zara
label: Retailer
description: ""
tags: []
hidden: false

catalog: my_db
schema: main
table_name: zara

dimensions:
  brand: {}
  url: {}
  sku: {}
  name: {}
  description: {}
  price: {}
  currency: {}
  scraped_at: {}
  section: {}

  terms:
    faceting:
      depends_on: [ product_position ]

  product_id:
    sql: '"Product ID"'
    format: ID

  product_position:
    sql: '"Product Position"'

  promotion:
    sql: '"Promotion"'

  product_category:
    sql: '"Product Category"'

  seasonal:
    sql: CAST("Seasonal" AS VARCHAR)
    filter_single_select_only: true

  sales_volume:
    sql: '"Sales Volume"'

  price_bucket:
    sql: |-
      CASE 
          WHEN ${my_db_main__zara.price} < 20 THEN '1. $0–$20'
          WHEN ${my_db_main__zara.price} < 40 THEN '2. $20–$40'
          WHEN ${my_db_main__zara.price} < 60 THEN '3. $40–$60'
          WHEN ${my_db_main__zara.price} < 80 THEN '4. $60–$80'
          WHEN ${my_db_main__zara.price} < 100 THEN '5. $80–$100'
          WHEN ${my_db_main__zara.price} < 120 THEN '6. $100–$120'
          WHEN ${my_db_main__zara.price} < 140 THEN '7. $120–$140'
          WHEN ${my_db_main__zara.price} < 160 THEN '8. $140–$160'
          WHEN ${my_db_main__zara.price} < 180 THEN '9. $160–$180'
          ELSE '10. $180+'
        END

  terms_groups:
    sql: ${my_db_main__zara.terms}
    groups:
      - filter:
          is: [ jackets, t-shirts, sweaters ]
        name: Tops
      - filter:
          is: shoes
        name: Accessories
      - filter:
          is: jeans
        name: Bottoms
    else: Other
    label: Terms Groups

  calculation:
    sql: COALESCE(${my_db_main__zara.price}, 0) + 100
    label: Calculation
    format: ""

  calculation_1:
    sql: COALESCE(${my_db_main__zara.price}, 0) + 90
    label: Calculation
    format: ""

measures:
  total_sales_volume:
    sql: SUM(${my_db_main__zara.sales_volume})*100

  product_position_list:
    sql: ${my_db_main__zara.product_position}
    aggregate_type: list

  product_position_count_distinct:
    sql: ${my_db_main__zara.product_position}
    aggregate_type: count_distinct

  product_id_count_distinct:
    sql: ${my_db_main__zara.product_id}
    aggregate_type: count_distinct

  sales_volume_sum:
    sql: ${my_db_main__zara.sales_volume}
    aggregate_type: sum

  terms_list:
    sql: ${my_db_main__zara.terms}
    aggregate_type: list

  terms_count_distinct:
    sql: ${my_db_main__zara.terms}
    aggregate_type: count_distinct

  product_id_sum:
    sql: ${my_db_main__zara.product_id}
    format: ID
    aggregate_type: sum

  sales_volume_min:
    sql: ${my_db_main__zara.sales_volume}
    aggregate_type: min

  count_set_test:
    drill_fields: [ set:parent_set ]
    aggregate_type: count
